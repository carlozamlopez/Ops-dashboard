<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            background: #1a1d2e;
            padding: 20px 40px;
            border-bottom: 1px solid #2d3148;
        }
        header h1 { color: #4f9cf9; font-size: 1.5rem; }
        header p  { color: #6b7280; font-size: 0.85rem; }
        .container { padding: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #1a1d2e;
            border: 1px solid #2d3148;
            border-radius: 12px;
            padding: 24px;
        }
        .card h3 { color: #6b7280; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; }
        .card .value { font-size: 2rem; font-weight: bold; color: #4f9cf9; }
        .card .unit  { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }
        .card .service { font-size: 0.75rem; color: #4ade80; margin-top: 8px; }
        table {
            width: 100%;
            background: #1a1d2e;
            border-radius: 12px;
            border-collapse: collapse;
            overflow: hidden;
        }
        th {
            background: #2d3148;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.8rem;
            color: #6b7280;
            text-transform: uppercase;
        }
        td { padding: 12px 16px; border-bottom: 1px solid #2d3148; font-size: 0.9rem; }
        tr:last-child td { border-bottom: none; }
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .ok  { background: #14532d; color: #4ade80; }
        .err { background: #450a0a; color: #f87171; }
        h2 { margin-bottom: 16px; color: #e0e0e0; font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <h1>⚡ OPS Dashboard</h1>
    <p>Azure Microservices Platform — Métricas operacionales en tiempo real</p>
</header>

<div class="container">

    <!-- Cards de resumen -->
    <div class="grid" id="cards">
        <div class="card">
            <h3>Cargando métricas...</h3>
            <div class="value">--</div>
        </div>
    </div>

    <!-- Tabla de detalle -->
    <h2>Detalle por servicio</h2>
    <table>
        <thead>
            <tr>
                <th>Servicio</th>
                <th>Métrica</th>
                <th>Promedio</th>
                <th>Máximo</th>
                <th>Mínimo</th>
                <th>Registros</th>
            </tr>
        </thead>
        <tbody id="table-body">
            <tr><td colspan="6">Cargando...</td></tr>
        </tbody>
    </table>

</div>

<script>
    async function loadMetrics() {
        try {
            const response = await fetch('/api/proxy/metrics');
            const data = await response.json();

            if (data.error) {
                document.getElementById('cards').innerHTML =
                    `<div class="card"><h3>Error</h3><div class="value" style="color:#f87171">API no disponible</div></div>`;
                return;
            }

            // Render cards
            const cards = data.summary.map(s => `
                <div class="card">
                    <h3>${s.metric_name || s.service_name}</h3>
                    <div class="value">${parseFloat(s.avg_value).toFixed(1)}</div>
                    <div class="unit">promedio</div>
                    <div class="service">● ${s.service_name}</div>
                </div>
            `).join('');
            document.getElementById('cards').innerHTML = cards;

            // Render tabla
            const rows = data.summary.map(s => `
                <tr>
                    <td>${s.service_name}</td>
                    <td>${s.metric_name || '—'}</td>
                    <td>${parseFloat(s.avg_value).toFixed(2)}</td>
                    <td>${parseFloat(s.max_value).toFixed(2)}</td>
                    <td>${parseFloat(s.min_value).toFixed(2)}</td>
                    <td>${s.total_records}</td>
                </tr>
            `).join('');
            document.getElementById('table-body').innerHTML = rows;

        } catch(e) {
            document.getElementById('cards').innerHTML =
                `<div class="card"><h3>Error</h3><div class="value" style="color:#f87171">Sin conexión</div></div>`;
        }
    }

    // Cargar al inicio y refrescar cada 30 segundos
    loadMetrics();
    setInterval(loadMetrics, 30000);
</script>

</body>
</html>
