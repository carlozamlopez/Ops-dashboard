# Deployment — define cómo corren los pods de la API
# Kubernetes garantiza que siempre haya 'replicas' pods corriendo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    project: ops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ops-dashboard-api:latest
          imagePullPolicy: Always   
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "development"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10