# Service — expone los pods de la API dentro del cluster
# Los pods tienen IPs dinámicas que cambian — el Service tiene IP fija
# Otros pods se conectan a la API via: http://api:5000
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ops-dashboard
  labels:
    app: api
    project: ops-dashboard
spec:
  selector:
    app: api      # conecta con pods que tengan label app: api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
  type: ClusterIP  # solo accesible dentro del cluster